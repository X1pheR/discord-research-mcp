name: Publish release image

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: ./scripts/verify.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/x1pher/discord-research-mcp:${{ github.ref_name }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" --json isDraft --jq .isDraft >/tmp/release-draft 2>/dev/null; then
            if [ "$(cat /tmp/release-draft)" = "true" ]; then
              gh release edit "$tag" --draft=false
            fi
            exit 0
          fi
          gh release create "$tag" --verify-tag --draft --generate-notes --title "$tag"
          gh release edit "$tag" --draft=false
