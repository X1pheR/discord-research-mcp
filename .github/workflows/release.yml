name: Recover release publication

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable release tag
        required: true
        type: string
      expected_sha:
        description: Exact commit expected behind the release tag
        required: true
        type: string

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - name: Validate immutable tag identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse "${{ inputs.tag }}^{commit}")" = "${{ inputs.expected_sha }}"
          test "$(git rev-parse HEAD)" = "${{ inputs.expected_sha }}"
          version=$(node -p 'require("./package.json").version')
          test "${{ inputs.tag }}" = "v${version}"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: ./scripts/verify.sh
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/x1pher/discord-research-mcp:${{ inputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/X1pheR/discord-research-mcp
            org.opencontainers.image.revision=${{ inputs.expected_sha }}
            org.opencontainers.image.version=${{ inputs.tag }}
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="${{ inputs.tag }}"
          if gh release view "$tag" --json isDraft --jq .isDraft >/tmp/release-draft 2>/dev/null; then
            if [ "$(cat /tmp/release-draft)" = "true" ]; then
              gh release edit "$tag" --draft=false
            fi
            exit 0
          fi
          gh release create "$tag" --verify-tag --generate-notes --title "$tag"
